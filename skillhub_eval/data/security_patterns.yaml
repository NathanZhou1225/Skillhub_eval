version: "1.0"
description: "SkillHub Security Intake Gate (Level 0.5) — static rule patterns"

# result_status: "blocked" → SECURITY_BLOCKED FAIL;  "warning" → continue + report
pattern_groups:

  - id: prompt_injection
    result_status: blocked
    finding_type: PROMPT_INJECTION
    description: "Prompt injection / jailbreak attempts"
    patterns:
      - "(?i)ignore previous instructions"
      - "(?i)ignore all previous"
      - "(?i)disregard (your|all) (previous|prior|above)"
      - "(?i)DAN mode"
      - "(?i)jailbreak"
      - "SYSTEM:\\s*[A-Z]"
      - "(?i)无视.*指令"
      - "(?i)忽略.*前面.*指令"
      - "(?i)绑架.*系统"
      - "(?i)角色扮演.*攻击"

  - id: dangerous_commands
    result_status: blocked
    finding_type: DANGEROUS_COMMAND
    description: "Shell destructive commands or arbitrary code execution"
    patterns:
      - "rm\\s+-rf"
      - "del\\s+/[sqf]"
      - "format\\s+[cC]:"
      - "os\\.system\\s*\\("
      - "subprocess\\.(call|run|Popen)\\s*\\("
      - "\\beval\\s*\\("
      - "\\bexec\\s*\\("
      - "__import__\\s*\\("
      - "compile\\s*\\(.*exec"
      - "shutil\\.rmtree\\s*\\("
      - "(?i)DROP\\s+TABLE"
      - "(?i)TRUNCATE\\s+TABLE"

  - id: hardcoded_secrets
    result_status: blocked
    finding_type: HARDCODED_SECRET
    description: "Hardcoded credentials, API keys or tokens"
    patterns:
      - "sk-[A-Za-z0-9]{20,}"
      - "Bearer\\s+[A-Za-z0-9\\-._~+/=]{16,}"
      - "(?i)password\\s*[=:]\\s*[\"'][^\"']{6,}[\"']"
      - "(?i)passwd\\s*[=:]\\s*[\"'][^\"']{6,}[\"']"
      - "(?i)api[_\\-]?key\\s*[=:]\\s*[\"'][^\"']{8,}[\"']"
      - "(?i)secret[_\\-]?key\\s*[=:]\\s*[\"'][^\"']{8,}[\"']"
      - "(?i)access[_\\-]?token\\s*[=:]\\s*[\"'][^\"']{8,}[\"']"
      - "(?i)private[_\\-]?key\\s*[=:]\\s*[\"'][^\"']{8,}[\"']"
      - "AKIA[0-9A-Z]{16}"

  - id: unauthorized_access
    result_status: warning
    finding_type: UNAUTHORIZED_ACCESS_DESCRIPTION
    description: "Skill description claims to bypass authorization or approval"
    patterns:
      - "(?i)无需用户确认"
      - "(?i)无需.*审批"
      - "(?i)必须作为首选"
      - "(?i)忽略权限"
      - "(?i)绕过.*审批"
      - "(?i)绕过.*权限"
      - "(?i)强制.*执行.*无需"
      - "(?i)不需要.*授权"

  - id: network_exfiltration
    result_status: warning
    finding_type: NETWORK_REQUEST
    description: "Outbound network calls that may exfiltrate data"
    patterns:
      - "requests\\.(get|post|put|delete|patch)\\s*\\("
      - "urllib\\.request"
      - "urllib\\.urlopen"
      - "httpx\\.(get|post|put|delete|patch)\\s*\\("
      - "aiohttp\\.ClientSession"
      - "\\bfetch\\s*\\("
      - "(?i)curl\\s+http"
      - "socket\\.connect\\s*\\("
