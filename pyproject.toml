[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillhub-eval"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "httpx"]

[project.scripts]
skillhub-eval = "skillhub_eval.adapters.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["skillhub_eval*"]

[tool.setuptools.package-data]
skillhub_eval = ["data/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--basetemp=.tmp/pytest-basetemp -p no:cacheprovider"
markers = [
    "requires_local_agent: needs installed CLI agent; set RUN_LOCAL_AGENT=1",
]
